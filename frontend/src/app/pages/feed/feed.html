<div class="feed-page">

  <!-- Header -->
  <header class="topbar">

    <div class="logo">
      AI DAILY
    </div>

    <div class="topbar-actions">
      <button class="icon-button" aria-label="Search">
        🔍
      </button>

      <a routerLink="/profile" class="profile-button">
        👤
      </a>
    </div>

  </header>


  <!-- Main content -->
  <main class="feed-container">

    <div class="feed-heading">
      <p class="eyebrow">YOUR DAILY AI BRIEF</p>
      <h1>For You</h1>
      <p class="subtitle">
        The latest developments in artificial intelligence,
        summarized for you.
      </p>
    </div>


    <!-- Articles -->
    <section class="articles">

      @for (article of articles(); track article.id) {

        <app-news-card
          [article]="article">
        </app-news-card>

      }

    </section>

  </main>

</div>
