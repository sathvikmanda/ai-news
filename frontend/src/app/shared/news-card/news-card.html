<article class="news-card">

  <div class="card-top">

    <span class="category">
      {{ article().category }}
    </span>

    <span class="read-time">
      {{ article().readTime }}
    </span>

  </div>

  <a
    class="article-link"
    [routerLink]="['/article', article().id]"
  >

    <h2>
      {{ article().title }}
    </h2>

    <p class="summary">
      {{ article().summary }}
    </p>

  </a>

  <div class="card-footer">

    <div class="source">
      {{ article().source }}
    </div>

    <div class="actions">

      <button
        type="button"
        class="action-button like-button"
        [class.active]="liked()"
        [disabled]="likeLoading()"
        (click)="toggleLike($event)"
      >
        @if (liked()) {
          ♥ Liked
        } @else {
          ♡ Like
        }
      </button>

      <button
        type="button"
        class="action-button save-button"
        [class.active]="saved()"
        [disabled]="saveLoading()"
        (click)="toggleSave($event)"
      >
        @if (saved()) {
          ★ Saved
        } @else {
          ☆ Save
        }
      </button>

    </div>

  </div>

</article>
