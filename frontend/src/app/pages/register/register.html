<div class="auth-page">
  <h1>Create Account</h1>

  <form>
    <input
      type="text"
      placeholder="Name"
    />

    <input
      type="email"
      placeholder="Email"
    />

    <input
      type="password"
      placeholder="Password"
    />

    <button type="submit">
      Register
    </button>
  </form>

  <a routerLink="/login">
    Already have an account?
  </a>
</div>
